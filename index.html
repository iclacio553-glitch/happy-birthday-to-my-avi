<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Birthday 🎉</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: Arial, sans-serif;
  overflow: hidden;
  text-align: center;
  color: white;
}

h1 {
  margin-top: 120px;
  font-size: 50px;
  animation: pop 1s ease-in-out infinite alternate;
}

p {
  font-size: 22px;
  margin-top: 10px;
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}

/* Balloons */
.balloon {
  position: absolute;
  bottom: -150px;
  width: 40px;
  height: 55px;
  background: red;
  border-radius: 50%;
  animation: float 8s infinite ease-in;
}

.balloon::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 60px;
  background: white;
  top: 55px;
  left: 50%;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* Button */
button {
  margin-top: 30px;
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  font-size: 18px;
  cursor: pointer;
  background: white;
  color: #ff4b5c;
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday 🎂</h1>
<p>Wishing you all the happiness in the world 💖</p>

<button onclick="alert('Happy Birthday!!! 🎉🎂💖')">Click for Surprise</button>

<!-- Balloons -->
<script>
const colors = ["#ff4b5c", "#ffcc00", "#6a5acd", "#00c9a7", "#ff7f50"];

for (let i = 0; i < 15; i++) {
  let balloon = document.createElement("div");
  balloon.className = "balloon";
  balloon.style.left = Math.random() * 100 + "vw";
  balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
  balloon.style.animationDuration = (5 + Math.random() * 5) + "s";
  document.body.appendChild(balloon);
}
</script>

</body>
</html>
